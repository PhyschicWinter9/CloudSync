name: Release

# Builds the ClaudeSync desktop app for macOS, Windows, and Linux and
# attaches the installers to a GitHub Release whenever a version tag
# (e.g. v1.2.0) is pushed. Also attaches a source distribution of the
# Python CLI so both halves of the project ship together.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run core logic tests before packaging
        run: npm test

      - name: Build installer
        run: npm run dist -- --publish never
        env:
          # No code-signing certificate is configured for this project;
          # produce unsigned builds rather than failing the build looking
          # for one (users get an OS "unidentified developer" warning).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p ../release-artifacts
          find dist -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.snap' \
          \) -exec cp {} ../release-artifacts/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: claudesync-desktop-${{ matrix.os }}
          path: release-artifacts/*
          if-no-files-found: error

  build-python-sdist:
    name: Build Python CLI source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ClaudeSync CI"

      - name: Run unit tests before packaging
        run: python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: claudesync-cli-python
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-python-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directories
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
