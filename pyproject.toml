[project]
name = "claudesync"
version = "0.1.0"
description = "Automatic backup and restore for everything Claude Code stores on your machine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
claudesync = "claudesync.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claudesync*"]
